[General]
# Block size in bytes — valid range: 100000 to 900000 (100 KB – 900 KB)
# Larger blocks give better compression but use more memory.
block_size = 500000

# RLE-1: run-length encoding applied before BWT
# Set to false to bypass (useful for benchmarking individual stages)
rle1_enabled = true

# BWT type: matrix (simple, O(n²)) or suffix_array (fast, O(n log n))
bwt_type = matrix

# MTF transform (Move-to-Front) applied after BWT
mtf_enabled = true

# RLE-2: zero-run encoding applied after MTF
rle2_enabled = true

# Huffman: canonical Huffman coding applied last
huffman_enabled = true

[Performance]
# benchmark_mode: when true, suppresses per-block debug output for speed
benchmark_mode = false

# output_metrics: print compression ratio, time, memory after each run
output_metrics = true

[Paths]
# Input file to compress
input_file = benchmarks/alice29.txt

# Output file (compressed)
output_file = output.bz2

# Directory containing benchmark test files (Canterbury/Calgary/Silesia corpora)
input_directory = ./benchmarks/

# Directory where results.csv and graphs are written
output_directory = ./results/
